<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen Chain — Dashboard</title>
<style>
  :root{
    --bg:#0b0e11;
    --panel:#14181d;
    --panel-2:#1a1f28;
    --line:#232a35;
    --fg:#eaeff3;
    --muted:#8b949e;
    --accent:#f0b90b;
    --accent-dim:rgba(240,185,11,.14);
    --ok:#3fb950;
    --err:#f85149;
    --warn:#d29922;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:28px 20px 80px}

  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px;
  }
  h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .pill{
    font-size:11px;padding:3px 10px;border-radius:999px;
    background:var(--accent-dim);border:1px solid rgba(240,185,11,.35);color:var(--accent);
    font-weight:600;
  }
  .spacer{flex:1}
  .live{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px rgba(63,185,80,.35)}
  .dot.off{background:var(--err);box-shadow:0 0 8px rgba(248,81,73,.35)}

  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin:14px 0 20px}
  .card{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(120deg,rgba(240,185,11,.06),transparent 40%);
    pointer-events:none;
  }
  .card b{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
  .card span{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--fg)}
  .card small{color:var(--muted);font-size:11px;margin-top:4px;display:block}

  .section{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;margin-top:16px;
  }
  h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:700}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
  .field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}
  label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  input,select,button{
    background:var(--panel-2);border:1px solid var(--line);color:var(--fg);
    padding:10px 12px;border-radius:10px;font-size:13px;outline:none;
  }
  input:focus,select:focus{border-color:var(--accent)}
  button{
    background:var(--accent);color:#0b0e11;border:none;font-weight:700;cursor:pointer;
    transition:transform .04s ease,filter .15s ease;
  }
  button:hover{filter:brightness(1.08)}
  button:active{transform:translateY(1px)}
  button.secondary{background:var(--panel-2);color:var(--fg);border:1px solid var(--line)}
  button.danger{background:rgba(248,81,73,.12);color:var(--err);border:1px solid rgba(248,81,73,.35)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  tr:hover td{background:rgba(240,185,11,.03)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#c9d1d9;word-break:break-all}
  .empty{color:var(--muted);padding:12px 0;font-size:13px}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;margin-left:6px}
  .tag.ok{background:rgba(63,185,80,.12);color:var(--ok);border:1px solid rgba(63,185,80,.35)}
  .tag.warn{background:rgba(210,153,34,.12);color:var(--warn);border:1px solid rgba(210,153,34,.35)}
  .tag.err{background:rgba(248,81,73,.12);color:var(--err);border:1px solid rgba(248,81,73,.35)}

  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:#6e7681;font-size:12px;text-align:center}
  a{color:var(--accent);text-decoration:none}

  .muted{color:var(--muted)}
  .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  @media (max-width:640px){
    .grid{grid-template-columns:1fr 1fr}
    h1{font-size:20px}
  }
  @media (max-width:420px){
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lumen Chain Dashboard</h1>
    <span class="pill" id="chain">…</span>
    <div class="spacer"></div>
    <div class="live">
      <span class="dot" id="dot"></span>
      <span id="ts">—</span>
    </div>
  </header>

  <div class="grid" id="cards"></div>

  <div class="section" id="statusSection">
    <h2>Статус узла</h2>
    <div id="nodeStatus" class="empty">Определяем локальный узел…</div>
  </div>

  <div class="section">
    <h2>Управление API-ключами</h2>
    <div class="row">
      <div class="field">
        <label>Имя ключа</label>
        <input id="keyName" placeholder="например: dapp-prod" />
      </div>
      <button onclick="createKey()">Создать ключ</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Имя</th><th>Ключ</th><th>Статус</th><th>Создан</th><th>Действия</th></tr></thead>
        <tbody id="keysTable"><tr><td class="empty" colspan="5">Нет ключей</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <h2>Реферальная программа</h2>
    <div class="row">
      <div class="field">
        <label>Код реферера</label>
        <input id="refCode" placeholder="например: 0xabc123" />
      </div>
      <button onclick="generateReferral()">Сгенерировать код</button>
    </div>
    <div class="row">
      <div class="field">
        <label>Статистика</label>
        <div id="refStats" class="muted" style="font-size:13px;padding:10px 0">Нет данных</div>
      </div>
    </div>
  </div>

  <footer>
  <div class="card">
    <h2>Калькулятор стейкинга</h2>
    <div class="grid">
      <div class="field">
        <label>Сумма стейка (LMN)</label>
        <input type="number" id="calc-amount" value="10000" oninput="calcRewards()">
      </div>
      <div class="field">
        <label>Период (дней)</label>
        <input type="number" id="calc-days" value="365" oninput="calcRewards()">
      </div>
    </div>
    <div class="grid" id="calc-result">
      <div class="stat-card">
        <div class="stat-value" id="calc-reward">0</div>
        <div class="stat-label">Награда за период (LMN)</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="calc-roi">3%</div>
        <div class="stat-label">ROI годовых</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="calc-monthly">0</div>
        <div class="stat-label">В месяц (LMN)</div>
      </div>
    </div>
  </div>

    Lumen Chain — monetization dashboard · <a href="/">Explorer</a>
  </footer>
</div>

<script>
const fmt = (n) => {
  const v = BigInt(n ?? 0n);
  const whole = v / 1000000n;
  const frac = (v % 1000000n).toString().padStart(6, "0").replace(/0+$/, "");
  return whole.toString() + (frac ? "." + frac : "");
};
const esc = (s) => String(s ?? "").replace(/[&<>\"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const uid = () => "lm_" + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
const now = () => new Date().toISOString();

/* ---------- API keys (localStorage-backed) ---------- */
function getKeys() {
  try { return JSON.parse(localStorage.getItem("lumen_keys") || "[]"); }
  catch { return []; }
}
function saveKeys(keys) { localStorage.setItem("lumen_keys", JSON.stringify(keys)); }

function createKey() {
  const name = document.getElementById("keyName").value.trim();
  if (!name) { alert("Введите имя ключа"); return; }
  const keys = getKeys();
  if (keys.find(k => k.name === name)) { alert("Ключ с таким именем уже существует"); return; }
  const key = { id: uid(), name, key: "lm_" + Array.from(crypto.getRandomValues(new Uint8Array(24))).map(b => b.toString(16).padStart(2,"0")).join(""), status: "active", created: now() };
  keys.push(key);
  saveKeys(keys);
  document.getElementById("keyName").value = "";
  renderKeys();
}
function revokeKey(id) {
  const keys = getKeys().map(k => k.id === id ? { ...k, status: "revoked" } : k);
  saveKeys(keys);
  renderKeys();
}
function deleteKey(id) {
  saveKeys(getKeys().filter(k => k.id !== id));
  renderKeys();
}
function renderKeys() {
  const keys = getKeys();
  const tbody = document.getElementById("keysTable");
  if (!keys.length) { tbody.innerHTML = `<tr><td class="empty" colspan="5">Нет ключей</td></tr>`; return; }
  tbody.innerHTML = keys.map(k => `<tr>
    <td>${esc(k.name)}</td>
    <td class="mono">${esc(k.key)}</td>
    <td><span class="tag ${k.status === "active" ? "ok" : "err"}">${k.status === "active" ? "активен" : "отозван"}</span></td>
    <td class="muted">${new Date(k.created).toLocaleString("ru")}</td>
    <td class="flex">
      ${k.status === "active" ? `<button class="secondary" style="padding:6px 10px;font-size:12px" onclick="revokeKey('${k.id}')">Отозвать</button>` : `<button class="danger" style="padding:6px 10px;font-size:12px" onclick="deleteKey('${k.id}')">Удалить</button>`}
    </td>
  </tr>`).join("");
}

/* ---------- Referrals (localStorage-backed) ---------- */
function getRefs() {
  try { return JSON.parse(localStorage.getItem("lumen_refs") || "[]"); }
  catch { return []; }
}
function saveRefs(refs) { localStorage.setItem("lumen_refs", JSON.stringify(refs)); }

function generateReferral() {
  const code = document.getElementById("refCode").value.trim();
  if (!code) { alert("Введите код реферера"); return; }
  let refs = getRefs();
  if (!refs.find(r => r.code === code)) {
    refs.push({ code, uses: 0, reward: 0, created: now() });
    saveRefs(refs);
  }
  renderRefs();
}
function renderRefs() {
  const refs = getRefs();
  const el = document.getElementById("refStats");
  if (!refs.length) { el.textContent = "Нет данных"; return; }
  const totalUses = refs.reduce((s, r) => s + (r.uses || 0), 0);
  const totalReward = refs.reduce((s, r) => s + (r.reward || 0), 0);
  el.innerHTML = `Кодов: <b>${refs.length}</b> · Всего использований: <b>${totalUses}</b> · Выплачено: <b>${fmt(totalReward * 1000000n)} LMN</b>` +
    (refs.map(r => `<div style="margin-top:8px;font-size:12px" class="mono">${esc(r.code)} — использований: ${r.uses}, начислено: ${fmt(BigInt(r.reward * 1000000n))} LMN</div>`).join(""));
}

/* ---------- Node status ---------- */
async function detectNode() {
  const el = document.getElementById("nodeStatus");
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error("not ok");
    const s = await r.json();
    const uptime = s.ts ? Math.floor((Date.now() - s.ts) / 1000) : 0;
    el.innerHTML = `
      <span class="tag ok">Запущен</span>
      &nbsp;<span class="muted">высота ${esc(s.height)}</span>
      &nbsp;<span class="muted">валидаторов ${esc(s.validators)}</span>
      &nbsp;<span class="muted">обновлено ${new Date(s.ts).toLocaleTimeString("ru")}</span>
    `;
  } catch {
    el.innerHTML = `<span class="tag err">Недоступен</span>&nbsp;<span class="muted">убедитесь, что узел запущен</span>`;
  }
}

function calcRewards() {
  const amount = parseFloat(document.getElementById("calc-amount").value) || 0
  const days = parseFloat(document.getElementById("calc-days").value) || 0
  const annualReward = amount * 0.03
  const periodReward = annualReward * (days / 365)
  const monthlyReward = annualReward / 12
  document.getElementById("calc-reward").textContent = periodReward.toLocaleString("ru-RU", { maximumFractionDigits: 2 })
  document.getElementById("calc-roi").textContent = "3%"
  document.getElementById("calc-monthly").textContent = monthlyReward.toLocaleString("ru-RU", { maximumFractionDigits: 2 })
}

/* ---------- Load state ---------- */
async function load() {
  let s;
  try {
    s = await (await fetch("/api/state", { cache: "no-store" })).json();
  } catch (e) {
    document.getElementById("ts").textContent = "нет связи с узлом";
    document.getElementById("dot").classList.add("off");
    return;
  }
  document.getElementById("chain").textContent = "Chain ID: " + (s.chainId ?? "—");
  document.getElementById("ts").textContent = "обновлено " + new Date(s.ts).toLocaleTimeString("ru");

  document.getElementById("cards").innerHTML = [
    ["Total supply", fmt(s.supply), "LMN всего"],
    ["Высота", s.height, "блоков в цепочке"],
    ["Валидаторы", s.validators, "активных"],
    ["Стейк", fmt(s.totalStake), "LMN в стейкинге"],
  ].map(([k, v, sub]) => `<div class="card"><b>${esc(k)}</b><span>${esc(v)}</span><small>${esc(sub)}</small></div>`).join("");

  detectNode();
}

load();
calcRewards();
renderKeys();
renderRefs();
</script>
</body>
</html>
