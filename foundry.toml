[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test/foundry"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }, { access = "write", path = "./deployments" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
