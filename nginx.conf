# nginx.conf — reverse proxy для lumen-chain с SSL
# Использование:
#   cp nginx.conf /etc/nginx/sites-available/lumen
#   ln -s /etc/nginx/sites-available/lumen /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

# Upstream (если explorer на отдельном порту)
upstream lumen_explorer {
    server 127.0.0.1:8899;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL (замените на свои пути или используйте certbot)
    ssl_certificate     /etc/letsencrypt/live/lumen/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumen/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # Explorer (веб-интерфейс)
    location / {
        proxy_pass http://lumen_explorer;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (не кэшировать)
    location /health {
        proxy_pass http://lumen_explorer/health;
        proxy_set_header Host              $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # RPC (JSON-RPC)
    location /api/rpc {
        proxy_pass http://lumen_explorer/api/rpc;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # State API
    location /api/state {
        proxy_pass http://lumen_explorer/api/state;
        proxy_set_header Host              $host;
        add_header Cache-Control "no-store";
    }
}
