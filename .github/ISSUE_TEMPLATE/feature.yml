name: ✨ Feature
description: An idea for the chain, the CLI, the keeper or the contracts.
labels: ["✨ Feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should it do, and where should it live (core/, cli/, keeper/, contracts/)?
