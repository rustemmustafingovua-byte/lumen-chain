name: Docker

# Build the image and boot the local devnet. Nothing is pushed to a registry.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the devnet
        run: docker compose up -d --build --wait

      - name: Stake and swap against the devnet
        run: bash scripts/devnet-smoke.sh http://127.0.0.1:8899

      - name: Logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v
