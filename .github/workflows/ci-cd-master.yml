name: Pipeline

# Pipeline for this repository.
# Publishing images, npm packages, GitHub Pages, and releases is intentionally
# not part of this workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  summary:
    name: Pipeline summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Record result
        run: |
          echo "## CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test and build | ${{ needs.test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.test.result }}" != "success" ]; then
            exit 1
          fi
