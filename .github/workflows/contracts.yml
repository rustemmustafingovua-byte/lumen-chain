name: Contracts
on:
  push:
    branches: [main]
    paths: ["contracts/**", "test/foundry/**", "script/**", "foundry.toml"]
  pull_request:
    paths: ["contracts/**", "test/foundry/**", "script/**", "foundry.toml"]
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: forge build --sizes
      - run: forge lint
      - run: forge test -vv

  # форк Base: реальные пулы Uniswap, реальный маршрутизатор, наш токен LMN
  fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Полный путь Lumen на форке Base
        env:
          BASE_RPC_URL: https://mainnet.base.org
        run: forge test --match-path "test/foundry/*FullPath.t.sol" --fork-url $BASE_RPC_URL -vv
